name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Check code quality and adapter behavior on both supported platforms.
  # Tests use a pinned Firstmate revision for reproducible compatibility checks.
  # Build the standalone CLI and confirm its help command runs on each platform.
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/checkout@v4
        with:
          repository: kunchenguid/firstmate
          ref: 861b5dad2baaa0a64703a1b0c14fb4da9bda5269
          path: .fixtures/firstmate
      - name: Install Linux isolation prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          FIRSTMATE_SOURCE: ${{ github.workspace }}/.fixtures/firstmate
      - run: bun run build
      - run: ./dist/fm-linear help
  # Check the Astro documentation for errors and verify the site builds for publication.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run docs:build
