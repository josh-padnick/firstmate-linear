<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{issue}} review</title></head>
<body>
  <main>
    <h1>{{issue}}: {{title}}</h1>
    <section id="outcome"><h2>Outcome</h2><p>{{outcome}}</p></section>
    <section id="changes"><h2>What changed</h2><p>{{changes}}</p></section>
    <section id="verification"><h2>Verification</h2><p>{{verification}}</p></section>
    <section id="review"><h2>How to review</h2><p>{{review}}</p></section>
  </main>
</body>
</html>
